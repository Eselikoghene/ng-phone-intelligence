name: Go CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and analyze
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Run static analysis
        run: go vet ./...

      - name: Run race detector
        run: go test -race ./...